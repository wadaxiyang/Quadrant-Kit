name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate tag format
        shell: bash
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: Verify version and prepare release notes
        shell: python
        run: |
          import os
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          tag = os.environ['TAG']
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if tag != f'v{version}':
              raise SystemExit('Tag does not match the checked-out package version')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          sections = re.split(r'^## ', Path('CHANGELOG.md').read_text(encoding='utf-8'), flags=re.M)
          section = next((s for s in sections if s.splitlines()[0].startswith(version + ' — ')), None)
          if section is None:
              raise SystemExit('Missing versioned changelog section')
          Path('target').mkdir(exist_ok=True)
          notes = section.split('\n', 1)[1].strip()
          notes += f'\n\nSource commit: `{sha}`.\n'
          notes += '\nSource-only Slint library; the Gallery is a development application. '
          notes += 'Same-tag CI and package checks passed. '
          notes += 'Fresh anonymous Git+SHA consumer verification is NOT_RUN by this workflow. '
          notes += f'[Known limitations](https://github.com/{os.environ["GH_REPO"]}/blob/{sha}/docs/STATUS.md) remain.\n'
          Path('target/release-notes.md').write_text(notes, encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'VERSION={version}\nSOURCE_SHA={sha}\n')
      - name: Wait for CI on this exact tag and commit
        shell: bash
        run: |
          for attempt in $(seq 1 135); do
            run=$(gh run list --workflow ci.yml --event push --branch "$TAG" \
              --commit "$SOURCE_SHA" --limit 1 --json status,conclusion,url)
            if [[ $(jq -r '.[0].status // "pending"' <<< "$run") == completed ]]; then
              jq -r '.[0].url' <<< "$run"
              [[ $(jq -r '.[0].conclusion' <<< "$run") == success ]] || exit 1
              exit 0
            fi
            echo "Waiting for CI on $TAG ($SOURCE_SHA), attempt $attempt/135"
            sleep 20
          done
          echo 'Timed out waiting for successful tag CI' >&2
          exit 1
      - name: Build and verify source archive
        shell: bash
        run: |
          cargo package --locked -p quadrant-kit
          python scripts/verify_distribution.py --package \
            --archive "target/package/quadrant-kit-$VERSION.crate"
          cd target/package
          sha256sum "quadrant-kit-$VERSION.crate" > SHA256SUMS
      - name: Publish release and assets
        shell: bash
        run: |
          # Refuse to overwrite an existing release or its assets on a rerun.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; inspect it before retrying" >&2
            exit 1
          fi
          gh release create "$TAG" --verify-tag --draft \
            --title "Quadrant Kit $VERSION" --notes-file target/release-notes.md \
            "target/package/quadrant-kit-$VERSION.crate" target/package/SHA256SUMS
          gh release edit "$TAG" --draft=false
