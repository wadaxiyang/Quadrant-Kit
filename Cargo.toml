[package]
name = "quadrant-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable Fluent-oriented Slint components and build-time source access"
publish = false
include = ["Cargo.toml", "src/**", "ui/**", "assets/icons/**", "LICENSE", "README.md", "THIRD-PARTY-NOTICES.md", "docs/**", "scripts/asset_manifest.json", "scripts/extraction_manifest.json", "scripts/kit_api_v1.json"]

[workspace]
members = ["gallery"]
default-members = [".", "gallery"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
repository = "https://github.com/wadaxiyang/Quadrant-Kit"

[workspace.dependencies]
slint = "=1.17.1"
slint-build = "=1.17.1"
png = "0.18.1"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[lints]
workspace = true
